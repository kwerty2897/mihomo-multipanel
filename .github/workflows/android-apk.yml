name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install npm dependencies
        run: npm install
      - name: Generate app icon
        run: |
          python -m pip install Pillow cairosvg
          mkdir -p src-tauri/icons
          cat > src-tauri/icons/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <g stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
              <path fill="#000" d="M256 66 421 157 421 354 256 446 91 354 91 157Z"/>
              <path fill="none" d="M91 157 256 250 421 157 M256 250 256 446"/>
              <path fill="none" d="M256 94 256 218 M123 336 234 272 M278 272 389 336"/>
            </g>
          </svg>
          SVG
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='src-tauri/icons/icon.svg',write_to='src-tauri/icons/icon.png',output_width=512,output_height=512)
          PY
      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init
      - name: Configure Android adaptive and themed icons
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#000000" android:strokeColor="#ffffff" android:strokeWidth="12" android:strokeLineJoin="round" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#ffffff" android:strokeWidth="12" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          cat > "$RES/drawable/ic_launcher_monochrome.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#000000" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#000000" android:strokeWidth="22" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
            <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          XML
      - name: Build signed debug APK
        run: cd src-tauri/gen/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
