name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install npm dependencies
        run: npm install
      - name: Generate app icon
        run: |
          python -m pip install Pillow
          mkdir -p src-tauri/icons
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new('RGBA', (512, 512), (20, 35, 55, 255))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((92, 92, 420, 420), radius=80, outline=(70, 190, 255, 255), width=22)
          d.line([(150, 335), (255, 180), (355, 285)], fill=(245, 250, 255, 255), width=34)
          for x, y in [(150, 335), (255, 180), (355, 285)]:
              d.ellipse((x-32, y-32, x+32, y+32), fill=(255, 255, 255, 255), outline=(70, 190, 255, 255), width=10)
          im.save('src-tauri/icons/icon.png')
          PY
      - name: Initialize Android project
        run: npx tauri android init
      - name: Build APK
        run: npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
