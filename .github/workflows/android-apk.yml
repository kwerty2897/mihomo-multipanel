name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: true
      - name: Install npm dependencies
        run: npm install
      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init
      - name: Generate app icons from SVG
        run: npx tauri icon src-tauri/icons/icon.svg
      - name: Configure and verify Android launcher icons
        run: |
          set -euo pipefail
          RES=src-tauri/gen/android/app/src/main/res
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml

          echo "Generated launcher resources:"
          find "$RES" -type f -name 'ic_launcher*' -print
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$RES/mipmap-$density/ic_launcher.png"
            test -s "$RES/mipmap-$density/ic_launcher_round.png"
          done

          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#00000000" android:strokeColor="#dadedf" android:strokeWidth="12" android:strokeLineJoin="round" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#ffffff" android:strokeWidth="12" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          cat > "$RES/drawable/ic_launcher_monochrome.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#000000" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#000000" android:strokeWidth="22" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
            <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          XML
          done

          # Force both launcher entries to our resources (some Android launchers prefer roundIcon).
          if grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          fi
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          fi

          echo "Launcher manifest configuration:"
          grep -o 'android:\(roundIcon\|icon\)="[^"]*"' "$MANIFEST"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"

          # Remove obsolete AGP compatibility switches from the generated project.
          GRADLE_PROPS=src-tauri/gen/android/gradle.properties
          touch "$GRADLE_PROPS"
          # AGP 9 enables built-in Kotlin by default; Tauri's generated app
          # still applies org.jetbrains.kotlin.android explicitly. Disable
          # built-in Kotlin until the Tauri Android template migrates.
          if grep -q '^android\.builtInKotlin=' "$GRADLE_PROPS"; then
            sed -i 's/^android\.builtInKotlin=.*/android.builtInKotlin=false/' "$GRADLE_PROPS"
          else
            echo 'android.builtInKotlin=false' >> "$GRADLE_PROPS"
          fi
          # This obsolete ProGuard compatibility switch is not needed.
          sed -i '/^android\.proguard\.failOnMissingFiles=/d' "$GRADLE_PROPS"
      - name: Build optimized release APK via Tauri
        run: npx tauri android build --apk --split-per-abi
      - name: Verify launcher icon in built APKs
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          for apk in "${apks[@]}"; do
            [[ "$apk" == *-unsigned.apk ]] || continue
            echo "Checking launcher metadata: $apk"
            "$AAPT" dump badging "$apk" | grep -E "^(application:|application-icon)"
          done
      - name: Sign APKs (persistent key or temporary fallback)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mihomo-multipanel-signing.jks"
          if [ -n "$SIGNING_KEY_BASE64" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$KEYSTORE"
            # Confirm the configured alias is actually a private-key entry; auto-select one if needed.
            listing="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD")"
            alias_info=""
            if [ -n "$SIGNING_KEY_ALIAS" ]; then
              alias_info="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null || true)"
            fi
            if [ -n "$SIGNING_KEY_ALIAS" ] && grep -q "Entry type: PrivateKeyEntry" <<< "$alias_info"; then
              alias="$SIGNING_KEY_ALIAS"
            else
              alias="$(printf '%s\n' "$listing" | awk '/Alias name:/{a=$3}/Entry type: PrivateKeyEntry/{print a;exit}')"
              if [ -z "$alias" ]; then
                echo "::error::Keystore contains no PrivateKeyEntry. Check the uploaded keystore and password."
                exit 1
              fi
              echo "::warning::Configured alias is not a PrivateKeyEntry; selected a private-key alias from the keystore."
            fi
            echo "Using persistent signing keystore and alias: $alias"
          else
            echo "::warning::Persistent signing secrets missing; temporary signing key used."
            SIGNING_KEY_PASSWORD="$(openssl rand -hex 24)"
            alias="multipanel-temporary"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mihomo MultiPanel, OU=Android, O=MultiPanel, C=US"
          fi
          export SIGNING_KEY_PASSWORD
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          for apk in "${apks[@]}"; do
            [[ "$apk" == *-unsigned.apk ]] || continue
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass env:SIGNING_KEY_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --ks-key-alias "$alias" "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            mv "$apk" "${apk%-unsigned.apk}.apk"
          done
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v6
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
