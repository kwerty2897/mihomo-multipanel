name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install npm dependencies
        run: npm install
      - name: Generate app icon
        run: |
          python -m pip install Pillow
          mkdir -p src-tauri/icons
          python - <<'PY'
          from PIL import Image, ImageDraw
          S=512
          im=Image.new('RGBA',(S,S)); p=im.load()
          for y in range(S):
            for x in range(S):
              t=(x+y)/(2*S); p[x,y]=(int(8+24*t),int(12+15*t),int(55+65*t),255)
          d=ImageDraw.Draw(im)
          # Minimal Mihomo-inspired mascot mark, without panel/dashboard elements
          d.polygon([(118,300),(125,160),(185,95),(238,151),(274,151),(330,95),(390,160),(395,300),(365,360),(150,360)],fill=(242,242,255,255))
          d.ellipse((178,213,211,258),fill=(17,20,62,255))
          d.ellipse((302,213,335,258),fill=(17,20,62,255))
          # tail accent
          d.arc((310,300,440,430),start=210,end=65,fill=(242,242,255,255),width=42)
          im.save('src-tauri/icons/icon.png')
          PY
      - name: Initialize Android project
        run: npx tauri android init
      - name: Build APK
        run: npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
