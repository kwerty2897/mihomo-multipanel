name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install npm dependencies
        run: npm install
      - name: Generate app icon
        run: |
          python -m pip install Pillow
          mkdir -p src-tauri/icons
          python - <<'PY'
          from PIL import Image, ImageDraw
          import math
          S=512
          im=Image.new('RGBA',(S,S)); px=im.load()
          for y in range(S):
            for x in range(S):
              t=(x+y)/(2*S); px[x,y]=(int(12+45*t),int(15+18*t),int(70+105*t),255)
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((26,26,486,486),radius=118,outline=(93,80,245,100),width=5)
          # Cat head silhouette
          d.polygon([(130,270),(135,155),(185,100),(230,150),(285,150),(340,100),(390,155),(395,270),(365,330),(160,330)],fill=(39,36,130,255),outline=(165,115,255,255))
          d.rounded_rectangle((177,185,205,238),radius=13,fill=(250,250,255,255)); d.rounded_rectangle((307,185,335,238),radius=13,fill=(250,250,255,255))
          # dashboard frame
          d.rounded_rectangle((65,275,447,440),radius=40,fill=(24,23,75,235),outline=(130,95,255,255),width=8)
          for i,c in enumerate([(255,70,90),(255,195,60),(40,220,175)]): d.ellipse((95+i*42,295,119+i*42,319),fill=c)
          # network nodes and connecting lines
          d.line([(145,378),(195,345),(230,388)],fill=(235,235,255),width=12)
          for x,y in [(145,378),(195,345),(230,388)]: d.ellipse((x-15,y-15,x+15,y+15),fill=(245,245,255))
          d.rounded_rectangle((260,345,330,363),radius=9,fill=(150,125,245)); d.rounded_rectangle((260,380,330,398),radius=9,fill=(150,125,245))
          d.rounded_rectangle((355,338,410,365),radius=14,fill=(30,215,165)); d.rounded_rectangle((355,375,410,402),radius=14,fill=(110,90,180))
          im.save('src-tauri/icons/icon.png')
          PY
      - name: Initialize Android project
        run: npx tauri android init
      - name: Build APK
        run: npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
