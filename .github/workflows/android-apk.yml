name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: true
      - name: Install npm dependencies
        run: npm install
      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init
      - name: Match Android launch splash to app background
        run: |
          set -euo pipefail
          RES=src-tauri/gen/android/app/src/main/res
          mkdir -p "$RES/values"
          cat > "$RES/values/multipanel_splash.xml" <<'XML'
          <resources>
            <color name="multipanel_splash_background">#101116</color>
          </resources>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("src-tauri/gen/android/app/src/main/res")
          files=list((root/"values").glob("styles.xml"))+list((root/"values").glob("themes.xml"))
          changed=False
          for path in files:
              s=path.read_text()
              # Apply a matching background to application launch themes.
              s=re.sub(r'(<style[^>]+(?:AppTheme|MainTheme)[^>]*>)(.*?)(</style>)',
                lambda m: m.group(1)+m.group(2)+ ('<item name="android:windowBackground">@color/multipanel_splash_background</item>' if 'android:windowBackground' not in m.group(2) else '')+m.group(3),s,flags=re.S)
              path.write_text(s)
              changed=True
          if not changed:
              print("No style file found; theme splash adjustment skipped.")
          PY
      - name: Make launch splash follow saved app theme
        run: |
          set -euo pipefail
          ROOT=src-tauri/gen/android/app/src/main
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("src-tauri/gen/android/app/src/main/res")
          files=list((root/"values").glob("styles.xml"))+list((root/"values").glob("themes.xml"))
          style_names=[]
          for f in files:
              s=f.read_text()
              style_names += re.findall(r'<style[^>]+name="([^"]+)"[^>]*>',s)
          base=next((n for n in style_names if "MainTheme" in n or "AppTheme" in n),None)
          if not base:
              base=next((n for n in style_names if "Tauri" in n),None)
          if not base: base="@android:style/Theme.Material.Light.NoActionBar"
          print("Using fallback Android theme parent:",base)
          (root/"values").mkdir(parents=True,exist_ok=True)
          (root/"values"/"multipanel_theme.xml").write_text(f'''<resources>
            <color name="multipanel_splash_light">#FAFAFA</color>
            <color name="multipanel_splash_dark">#101116</color>
            <style name="MultiPanelSplashLight" parent="{base}">
              <item name="android:windowBackground">@color/multipanel_splash_light</item>
              <item name="android:windowSplashScreenBackground">@color/multipanel_splash_light</item>
            </style>
            <style name="MultiPanelSplashDark" parent="{base}">
              <item name="android:windowBackground">@color/multipanel_splash_dark</item>
              <item name="android:windowSplashScreenBackground">@color/multipanel_splash_dark</item>
            </style>
          </resources>''')
          night=root/"values-night"
          night.mkdir(exist_ok=True)
          (night/"multipanel_theme.xml").write_text(f'''<resources>
            <style name="MultiPanelSplashSystem" parent="{base}">
              <item name="android:windowBackground">@color/multipanel_splash_dark</item>
              <item name="android:windowSplashScreenBackground">@color/multipanel_splash_dark</item>
            </style>
          </resources>''')
          day=root/"values"
          (day/"multipanel_system_theme.xml").write_text(f'''<resources>
            <style name="MultiPanelSplashSystem" parent="{base}">
              <item name="android:windowBackground">@color/multipanel_splash_light</item>
              <item name="android:windowSplashScreenBackground">@color/multipanel_splash_light</item>
            </style>
          </resources>''')
          print("Generated splash styles based on",base)
          PY
      - name: Configure Android system navigation bar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src-tauri/gen/android/app/src/main")
          candidates = list(root.rglob("MainActivity.kt"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one MainActivity.kt, found: {candidates}")
          path = candidates[0]
          source = path.read_text()
          class_start = source.find("class MainActivity")
          if class_start < 0:
              raise SystemExit(f"Could not find MainActivity declaration in {path}")
          replacement = """class MainActivity : TauriActivity() {
              private var cacheManager: android.net.ConnectivityManager? = null
              private var cacheCallback: android.net.ConnectivityManager.NetworkCallback? = null

              private var appTheme = "system"

              private fun applyLaunchTheme(value: String) {
                  when (value) {
                      "light" -> setTheme(R.style.MultiPanelSplashLight)
                      "dark" -> setTheme(R.style.MultiPanelSplashDark)
                      else -> setTheme(R.style.MultiPanelSplashSystem)
                  }
              }

              inner class SystemBarsBridge {
                  @android.webkit.JavascriptInterface
                  fun getPalette(): String {
                      if (android.os.Build.VERSION.SDK_INT < 31) return ""
                      val names = listOf("system_accent1_600", "system_accent1_100", "system_accent1_200", "system_accent2_600", "system_accent2_100", "system_accent3_600", "system_accent3_100")
                      val keys = listOf("primary", "primaryContainer", "secondary", "secondary", "secondaryContainer", "tertiary", "tertiaryContainer")
                      val json = org.json.JSONObject()
                      try {
                          for (i in names.indices) {
                              val id = resources.getIdentifier(names[i], "color", "android")
                              if (id != 0) json.put(keys[i], String.format("#%06X", 0xFFFFFF and getColor(id)))
                          }
                          val id = resources.getIdentifier("system_accent1_700", "color", "android")
                          if (id != 0) json.put("onPrimary", String.format("#%06X", 0xFFFFFF and getColor(id)))
                      } catch (_: Exception) {}
                      return json.toString()
                  }
                  @android.webkit.JavascriptInterface
                  fun setTheme(value: String) {
                      appTheme = if (value == "light" || value == "dark") value else "system"
                      getSharedPreferences("multipanel_theme", android.content.Context.MODE_PRIVATE).edit().putString("theme", appTheme).apply()
                      runOnUiThread { updateSystemBars() }
                  }
              }

              override fun onWebViewCreate(webView: android.webkit.WebView) {
                  webView.addJavascriptInterface(SystemBarsBridge(), "AndroidSystemBars")
                  webView.settings.domStorageEnabled = true
                  webView.settings.mixedContentMode = android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  webView.settings.cacheMode = android.webkit.WebSettings.LOAD_CACHE_ELSE_NETWORK
                  val manager = getSystemService(android.content.Context.CONNECTIVITY_SERVICE)
                      as android.net.ConnectivityManager
                  cacheManager = manager

                  fun refreshCacheMode() {
                      val caps = manager.activeNetwork?.let { manager.getNetworkCapabilities(it) }
                      val online = caps?.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET) == true &&
                          caps.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_VALIDATED)
                      webView.post {
                          webView.settings.cacheMode = if (online)
                              android.webkit.WebSettings.LOAD_DEFAULT
                          else
                              android.webkit.WebSettings.LOAD_CACHE_ELSE_NETWORK
                      }
                  }

                  val callback = object : android.net.ConnectivityManager.NetworkCallback() {
                      override fun onAvailable(network: android.net.Network) = refreshCacheMode()
                      override fun onCapabilitiesChanged(network: android.net.Network, capabilities: android.net.NetworkCapabilities) = refreshCacheMode()
                      override fun onLost(network: android.net.Network) = refreshCacheMode()
                  }
                  cacheCallback = callback
                  try { manager.registerDefaultNetworkCallback(callback) } catch (_: Exception) {}
                  refreshCacheMode()
              }

              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  appTheme = getSharedPreferences("multipanel_theme", android.content.Context.MODE_PRIVATE).getString("theme", "system") ?: "system"
                  applyLaunchTheme(appTheme)
                  super.onCreate(savedInstanceState)
                  updateSystemBars()
              }

              override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {
                  super.onConfigurationChanged(newConfig)
                  updateSystemBars()
              }

              override fun onDestroy() {
                  val manager = cacheManager
                  val callback = cacheCallback
                  if (manager != null && callback != null) {
                      try { manager.unregisterNetworkCallback(callback) } catch (_: Exception) {}
                  }
                  cacheCallback = null
                  cacheManager = null
                  super.onDestroy()
              }

              @Suppress("DEPRECATION")
              private fun updateSystemBars() {
                  val systemDark = (resources.configuration.uiMode and
                      android.content.res.Configuration.UI_MODE_NIGHT_MASK) ==
                      android.content.res.Configuration.UI_MODE_NIGHT_YES
                  val darkTheme = when (appTheme) {
                      "dark" -> true
                      "light" -> false
                      else -> systemDark
                  }
                  window.statusBarColor = android.graphics.Color.TRANSPARENT
                  window.navigationBarColor = android.graphics.Color.TRANSPARENT
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      window.isNavigationBarContrastEnforced = false
                      window.isStatusBarContrastEnforced = false
                  }
                  var flags = window.decorView.systemUiVisibility
                  flags = flags or android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  flags = if (darkTheme) {
                      flags and android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR.inv() and
                          android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR.inv()
                  } else {
                      flags or android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or
                          android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  }
                  window.decorView.systemUiVisibility = flags
              }
          }"""
          updated = source[:class_start] + replacement + "\n"
          path.write_text(updated)
          print(f"Configured navigation bar in {path}")
          PY
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if grep -q 'android:usesCleartextTraffic=' "$MANIFEST"; then
            sed -i 's#android:usesCleartextTraffic="[^"]*"#android:usesCleartextTraffic="true"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          fi
          grep -q 'android:usesCleartextTraffic="true"' "$MANIFEST"
          # Monitor connectivity so the WebView can prefer cached panel assets offline.
          if ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"; then
            python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          source = source.replace("<application", '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          path.write_text(source)
          PY
          fi
          grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"
      - name: Generate app icons from SVG
        run: npx tauri icon src-tauri/icons/icon.svg
      - name: Install Pillow for transparent launcher PNGs
        run: python3 -m pip install --user Pillow
      - name: Configure and verify Android launcher icons
        run: |
          set -euo pipefail
          RES=src-tauri/gen/android/app/src/main/res
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml

          echo "Generated launcher resources:"
          find "$RES" -type f -name 'ic_launcher*' -print
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$RES/mipmap-$density/ic_launcher.png"
            test -s "$RES/mipmap-$density/ic_launcher_round.png"
          done

          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          # Replace Tauri-generated legacy launcher PNGs (which may carry a baked background)
          # with a transparent canvas and only the cube artwork.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path("src-tauri/gen/android/app/src/main/res")
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          def point(x,y): return ((x+92)*.64/512, (y+92)*.64/512)
          vertices=[point(256,64),point(432,160),point(432,352),point(256,448),point(80,352),point(80,160)]
          for density,size in sizes.items():
              folder=root/f"mipmap-{density}"
              folder.mkdir(exist_ok=True)
              for name in ("ic_launcher.png","ic_launcher_round.png"):
                  im=Image.new("RGBA",(size,size),(0,0,0,0)); d=ImageDraw.Draw(im)
                  pts=[(round(x*size),round(y*size)) for x,y in vertices]
                  d.polygon(pts,fill=(0,0,0,255))
                  d.line(pts+[pts[0]],fill=(255,255,255,255),width=max(1,round(size*16/512)),joint="curve")
                  im.save(folder/name)
          PY
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <resources>
            <color name="ic_launcher_background">#00000000</color>
          </resources>
          XML
          # Transparent adaptive icon: black cube with complete rear edges and white outline.
          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <group android:translateX="92" android:translateY="92" android:scaleX="0.64" android:scaleY="0.64">
              <path android:fillColor="#000000" android:pathData="M256,64 L432,160 L432,352 L256,448 L80,352 L80,160 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="16" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M256,64 L432,160 L432,352 L256,448 L80,352 L80,160 Z"/>
            </group>
          </vector>
          XML
          cat > "$RES/drawable/ic_launcher_monochrome.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <group android:translateX="92" android:translateY="92" android:scaleX="0.64" android:scaleY="0.64">
              <path android:fillColor="#FFFFFFFF" android:pathData="M256,64 L432,160 L432,352 L256,448 L80,352 L80,160 Z"/>
            </group>
          </vector>
          XML
          mkdir -p "$RES/drawable-v24" "$RES/mipmap-anydpi-v26"
          cp "$RES/drawable/ic_launcher_foreground.xml" "$RES/drawable-v24/ic_launcher_foreground.xml"

          # Keep launcher icon identical to About, never apply system monochrome tint.
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
            <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          XML
          done

          if grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:icon="@mipmap/ic_launcher"#' "$MANIFEST"
          fi
          if grep -q 'android:roundIcon=' "$MANIFEST"; then
            sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          else
            sed -i 's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' "$MANIFEST"
          fi
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"

          # Remove obsolete AGP compatibility switches from the generated project.
          GRADLE_PROPS=src-tauri/gen/android/gradle.properties
          touch "$GRADLE_PROPS"
          # AGP 9 enables built-in Kotlin by default; Tauri's generated app
          # still applies org.jetbrains.kotlin.android explicitly. Disable
          # built-in Kotlin until the Tauri Android template migrates.
          if grep -q '^android\.builtInKotlin=' "$GRADLE_PROPS"; then
            sed -i 's/^android\.builtInKotlin=.*/android.builtInKotlin=false/' "$GRADLE_PROPS"
          else
            echo 'android.builtInKotlin=false' >> "$GRADLE_PROPS"
          fi
          # This obsolete ProGuard compatibility switch is not needed.
          sed -i '/^android\.proguard\.failOnMissingFiles=/d' "$GRADLE_PROPS"
      - name: Build optimized release APK via Tauri
        run: npx tauri android build --apk --split-per-abi
      - name: Verify launcher icon in built APKs
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          for apk in "${apks[@]}"; do
            [[ "$apk" == *-unsigned.apk ]] || continue
            echo "Checking launcher metadata: $apk"
            "$AAPT" dump badging "$apk" | grep -E "^(application:|application-icon)"
          done
      - name: Sign APKs (persistent key or temporary fallback)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mihomo-multipanel-signing.jks"
          if [ -n "$SIGNING_KEY_BASE64" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$KEYSTORE"
            # Confirm the configured alias is actually a private-key entry; auto-select one if needed.
            listing="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD")"
            alias_info=""
            if [ -n "$SIGNING_KEY_ALIAS" ]; then
              alias_info="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null || true)"
            fi
            if [ -n "$SIGNING_KEY_ALIAS" ] && grep -q "Entry type: PrivateKeyEntry" <<< "$alias_info"; then
              alias="$SIGNING_KEY_ALIAS"
            else
              alias="$(printf '%s\n' "$listing" | awk '/Alias name:/{a=$3}/Entry type: PrivateKeyEntry/{print a;exit}')"
              if [ -z "$alias" ]; then
                echo "::error::Keystore contains no PrivateKeyEntry. Check the uploaded keystore and password."
                exit 1
              fi
            fi
            echo "Using persistent signing keystore and alias: $alias"
          else
            echo "::warning::Persistent signing secrets missing; temporary signing key used."
            SIGNING_KEY_PASSWORD="$(openssl rand -hex 24)"
            alias="multipanel-temporary"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mihomo MultiPanel, OU=Android, O=MultiPanel, C=US"
          fi
          export SIGNING_KEY_PASSWORD
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          for apk in "${apks[@]}"; do
            [[ "$apk" == *-unsigned.apk ]] || continue
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass env:SIGNING_KEY_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --ks-key-alias "$alias" "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            mv "$apk" "${apk%-unsigned.apk}.apk"
          done
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v6
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
