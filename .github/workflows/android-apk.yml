name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install npm dependencies
        run: npm install
      - name: Generate app icon
        run: |
          python -m pip install Pillow cairosvg
          mkdir -p src-tauri/icons
          cat > src-tauri/icons/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <g stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
              <path fill="#000" d="M256 66 421 157 421 354 256 446 91 354 91 157Z"/>
              <path fill="none" d="M91 157 256 250 421 157 M256 250 256 446"/>
              <path fill="none" d="M256 94 256 218 M123 336 234 272 M278 272 389 336"/>
            </g>
          </svg>
          SVG
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='src-tauri/icons/icon.svg',write_to='src-tauri/icons/icon.png',output_width=512,output_height=512)
          PY
      - name: Initialize Android project
        run: npx tauri android init
      - name: Build APK
        run: npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
