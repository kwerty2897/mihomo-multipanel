name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all: true
      - name: Install npm dependencies
        run: npm install
      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init
      - name: Generate app icons from SVG
        run: npx tauri icon src-tauri/icons/icon.svg
      - name: Configure Android adaptive and themed icons
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          echo "Generated launcher icon resources:"
          find "$RES" -maxdepth 2 -type f \( -name 'ic_launcher*' -o -name '*launcher*' \) -print
          test -n "$(find "$RES" -type f -name 'ic_launcher.png' -o -name 'ic_launcher.webp' | head -n1)" || { echo "::error::Tauri did not generate Android launcher raster icons"; exit 1; }
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26"
          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#00000000" android:strokeColor="#dadedf" android:strokeWidth="12" android:strokeLineJoin="round" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#ffffff" android:strokeWidth="12" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          cat > "$RES/drawable/ic_launcher_monochrome.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#000000" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#000000" android:strokeWidth="22" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
            <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          XML
      - name: Build optimized release APK via Tauri
        run: npx tauri android build --apk --split-per-abi
      - name: Sign APKs (persistent key or temporary fallback)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mihomo-multipanel-signing.jks"
          if [ -n "$SIGNING_KEY_BASE64" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$KEYSTORE"
            # Confirm the configured alias is actually a private-key entry; auto-select one if needed.
            listing="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD")"
            if [ -n "$SIGNING_KEY_ALIAS" ] && echo "$listing" | grep -A3 -F "Alias name: $SIGNING_KEY_ALIAS" | grep -q "PrivateKeyEntry"; then
              alias="$SIGNING_KEY_ALIAS"
            else
              alias="$(printf '%s\n' "$listing" | awk '/Alias name:/{a=$3}/Entry type: PrivateKeyEntry/{print a;exit}')"
              if [ -z "$alias" ]; then
                echo "::error::Keystore contains no PrivateKeyEntry. Check the uploaded keystore and password."
                exit 1
              fi
              echo "::warning::Secret alias did not match a private-key entry; selected alias from keystore."
            fi
            echo "Using persistent signing keystore and alias: $alias"
          else
            echo "::warning::Persistent signing secrets missing; temporary signing key used."
            SIGNING_KEY_PASSWORD="$(openssl rand -hex 24)"
            alias="multipanel-temporary"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mihomo MultiPanel, OU=Android, O=MultiPanel, C=US"
          fi
          export SIGNING_KEY_PASSWORD
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          for apk in "${apks[@]}"; do
            [[ "$apk" == *-unsigned.apk ]] || continue
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass env:SIGNING_KEY_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --ks-key-alias "$alias" "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            mv "$apk" "${apk%-unsigned.apk}.apk"
          done
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
