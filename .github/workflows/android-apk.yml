name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: pip-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all: true
      - name: Install npm dependencies
        run: npm install
      - name: Generate app icon
        run: |
          python -m pip install --cache-dir ~/.cache/pip Pillow cairosvg
          mkdir -p src-tauri/icons
          cat > src-tauri/icons/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <!-- MetaCubeXD-inspired mark, transparent canvas, no shadow/background -->
            <g fill="none" stroke="#dadedf" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
              <path d="M256 76 405 161 405 344 256 430 107 344 107 161Z"/>
              <path d="M107 161 256 247 405 161 M256 247 256 430"/>
              <path d="M256 103 256 221 M145 322 235 270 M277 270 367 322"/>
            </g>
          </svg>
          SVG
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='src-tauri/icons/icon.svg',write_to='src-tauri/icons/icon.png',output_width=512,output_height=512)
          PY
      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android
          npx tauri android init
      - name: Configure Android adaptive and themed icons
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          python - <<'PY'
          from PIL import Image
          base=Image.open("src-tauri/icons/icon.png").convert("RGBA")
          for bucket,size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              d=f"src-tauri/gen/android/app/src/main/res/mipmap-{bucket}"
              icon=base.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(f"{d}/ic_launcher.png")
              icon.save(f"{d}/ic_launcher_round.png")
          PY
          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#00000000" android:strokeColor="#dadedf" android:strokeWidth="12" android:strokeLineJoin="round" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#ffffff" android:strokeWidth="12" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          cat > "$RES/drawable/ic_launcher_monochrome.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#000000" android:pathData="M256,66 L421,157 L421,354 L256,446 L91,354 L91,157 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#000000" android:strokeWidth="22" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M91,157 L256,250 L421,157 M256,250 L256,446 M256,94 L256,218 M123,336 L234,272 M278,272 L389,336"/>
          </vector>
          XML
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
            <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          XML
      - name: Build optimized release APK via Tauri
        run: npx tauri android build --apk --split-per-abi
      - name: Sign APKs (persistent key or temporary fallback)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mihomo-multipanel-signing.jks"
          if [ -n "$SIGNING_KEY_BASE64" ] && [ -n "$SIGNING_KEY_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ]; then
            echo "Using configured persistent signing key."
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$KEYSTORE"
          else
            echo "::warning::Persistent signing secrets are not configured. APKs will be signed with an ephemeral key; future updates signed this way cannot update APKs signed with another key."
            SIGNING_KEY_PASSWORD="$(openssl rand -hex 24)"
            SIGNING_KEY_ALIAS="multipanel-temporary"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$SIGNING_KEY_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mihomo MultiPanel, OU=Android, O=MultiPanel, L=, ST=, C=US"
          fi
          export SIGNING_KEY_PASSWORD SIGNING_KEY_ALIAS
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          for apk in "${apks[@]}"; do
            [[ "$apk" == *-unsigned.apk ]] || continue
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass env:SIGNING_KEY_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD --ks-key-alias "$SIGNING_KEY_ALIAS" "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            signed="${apk%-unsigned.apk}.apk"
            mv "$apk" "$signed"
          done
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-multipanel-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
